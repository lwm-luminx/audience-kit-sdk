name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  version:
    # Each change to the SDK needs a new version: apps send it, and the API refuses ones below its minimum.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-version.sh origin/${{ github.base_ref }}

  apple:
    # The update prompts' StoreKit, SwiftUI and UIKit code only builds on Apple platforms, which Linux skips.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: xcodebuild build -scheme AudienceKit-Package -destination 'generic/platform=iOS Simulator' -quiet
