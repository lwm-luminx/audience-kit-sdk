name: Node

# The audience-kit npm package in node/, which has its own version (node/package.json) and isn't part of the Swift and
# Kotlin release. Its tests validate the documents against graphql/schema.graphql, so a schema change runs it too.

on:
  push:
    branches: [main]
    paths:
      - "node/**"
      - "graphql/**"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "node/**"
      - "graphql/**"
      - ".github/workflows/node.yml"
  workflow_dispatch:

permissions:
  # Read-only by default; jobs that tag releases ask for contents: write themselves.
  contents: read

concurrency:
  # A newer push to a pull request replaces its run; runs on main always finish (they tag releases).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    # The audience-kit npm package in node/: typecheck, the tests (offline, against a stub transport; every document is
    # validated against graphql/schema.graphql) with line coverage at 85% or more (100% at 0.1.0), and the ESM + CJS
    # build, on each Node it supports. It has its own version, so the version job doesn't look at it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - name: The built package loads from CommonJS and ES modules
        run: |
          node -e "const sdk = require('./dist/index.cjs'); if (!sdk.AudienceKitClient) process.exit(1)"
          node --input-type=module -e "import { AudienceKitClient } from './dist/index.js'; if (!AudienceKitClient) process.exit(1)"
      - run: npm pack --dry-run
