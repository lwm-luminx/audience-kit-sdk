name: PHP

# The audiencekit/audiencekit Composer package in php/. Its own version; on main it tags php/<version>.

on:
  push:
    branches: [main]
    paths:
      - "php/**"
      - "graphql/**"
      - "scripts/graphql/**"
      - ".github/workflows/php.yml"
  pull_request:
    paths:
      - "php/**"
      - "graphql/**"
      - "scripts/graphql/**"
      - ".github/workflows/php.yml"
  workflow_dispatch:

permissions:
  # Read-only by default; jobs that tag releases ask for contents: write themselves.
  contents: read

concurrency:
  # A newer push to a pull request replaces its run; runs on main always finish (they tag releases).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    # The audiencekit/audiencekit Composer package in php/: PHPUnit with the 85% line-coverage floor
    # (php/scripts/coverage.php), its GraphQL documents checked against the schema like the Swift and Kotlin ones,
    # and its own version (php/src/AudienceKit.php, php/CHANGELOG.md), which the version job doesn't look at. On
    # main, tags the version php/<version> (a prefix, so it never clashes with the Swift package's bare tags).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    defaults:
      run:
        working-directory: php
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: scripts/check-version.sh origin/${{ github.base_ref || 'main' }}
      - name: Tests, with line coverage at 85% or more (98.9% at 0.1.0)
        run: |
          vendor/bin/phpunit --coverage-clover build/clover.xml
          php scripts/coverage.php build/clover.xml 85
      - name: GraphQL documents match the API schema
        run: |
          php bin/graphql-documents build/graphql
          # The checker imports graphql from where it lives, so the package goes at the repository root.
          (cd .. && npm install --silent --no-save --no-package-lock graphql@16)
          node ../scripts/graphql/check.mjs --schema ../graphql/schema.graphql --endpoint consumer build/graphql
      - name: Tag the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.php == '8.3'
        run: scripts/tag-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  split:
    # Packagist reads a package only from a repository's root, so the php/ directory is mirrored to
    # lwm-luminx/audiencekit-php (with the repository's LICENSE) and tagged with the bare version there, which Packagist
    # picks up from that repository's webhook. Pushes with the PHP_SPLIT_DEPLOY_KEY secret, a deploy key with write
    # access on that repository; skipped until it's set.
    needs: php
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.PHP_SPLIT_DEPLOY_KEY }}
    steps:
      - if: env.DEPLOY_KEY == ''
        run: echo "::notice::PHP_SPLIT_DEPLOY_KEY isn't set, so php/ isn't mirrored to lwm-luminx/audiencekit-php."
      - if: env.DEPLOY_KEY != ''
        uses: actions/checkout@v4
        with:
          path: sdk
      - name: Mirror php/ and tag its version
        if: env.DEPLOY_KEY != ''
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/split && chmod 600 ~/.ssh/split
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/split -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          version="$(sed -n "s/.*public const VERSION = '\([0-9.]*\)';.*/\1/p" sdk/php/src/AudienceKit.php)"
          git clone --quiet git@github.com:lwm-luminx/audiencekit-php.git split
          cd split
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "audiencekit-php has $version already."
            exit 0
          fi
          git checkout --quiet -B main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          (cd ../sdk/php && git archive HEAD) | tar -x
          cp ../sdk/LICENSE LICENSE
          # The README's links up into the monorepo point at the mirror's own LICENSE, or at the monorepo on GitHub.
          sed -i -e 's#](\.\./LICENSE)#](LICENSE)#g' \
            -e 's#](\.\./\([^)]*\))#](https://github.com/lwm-luminx/audience-kit-sdk/blob/main/\1)#g' README.md
          git add -A
          git commit --quiet --allow-empty -m "audiencekit/audiencekit $version" \
            -m "From lwm-luminx/audience-kit-sdk@${GITHUB_SHA} (php/). Make changes there; this repository is a read-only mirror."
          git tag "$version"
          git push --quiet origin main "refs/tags/$version"
          echo "Mirrored php/ as audiencekit-php $version."
