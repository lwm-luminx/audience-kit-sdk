name: Python release

# Publishes the audiencekit package in python/ to PyPI when main carries a version PyPI doesn't have yet
# (python/src/audiencekit/_version.py), then tags the commit python-<version>: the prefix keeps these tags apart from
# the Swift package's bare version tags, which Swift Package Manager resolves. Uploads with PyPI trusted publishing, so
# no token is stored here; PyPI's (pending) publisher names this repository, python-release.yml and the `pypi`
# environment.

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Is this version on PyPI yet?
        id: version
        run: |
          version="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/audiencekit/_version.py").read_text()).group(1))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/audiencekit/$version/json")"
          if [[ "$status" == 200 ]]; then
            echo "audiencekit $version is on PyPI already."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: pip install -e ".[dev]" build
      - if: steps.version.outputs.published == 'false'
        run: pytest --cov
      - name: Ship the repository LICENSE in the sdist and wheel
        if: steps.version.outputs.published == 'false'
        run: cp ../LICENSE LICENSE
      - if: steps.version.outputs.published == 'false'
        run: python -m build
      - if: steps.version.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
      - name: Tag the release
        run: |
          tag="python-${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "The tag $tag is there already."
          else
            git tag "$tag" && git push origin "refs/tags/$tag"
          fi
