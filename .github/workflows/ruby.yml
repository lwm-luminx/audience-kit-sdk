name: Ruby

# The audience-kit gem in ruby/, which has its own version and isn't part of the Swift and Kotlin release.

on:
  push:
    branches: [main]
    paths:
      - "ruby/**"
      - ".github/workflows/ruby.yml"
  pull_request:
    paths:
      - "ruby/**"
      - ".github/workflows/ruby.yml"
  workflow_dispatch:

permissions:
  # Read-only by default; jobs that tag releases ask for contents: write themselves.
  contents: read

concurrency:
  # A newer push to a pull request replaces its run; runs on main always finish (they tag releases).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruby:
    # The audience-kit gem in ruby/ (folded in from audience-kit-sdk-ruby): specs, RuboCop and the gem build, on each
    # Ruby it supports. It has its own version, so the version job doesn't look at it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      # Specs (SimpleCov fails them when a line or branch of lib/ isn't covered, since CI sets CI) and RuboCop.
      - run: bundle exec rake
      - run: gem build audience-kit.gemspec
      # The gem's GraphQL documents, checked against the API schema like the other SDKs' (once: they're the same on
      # every Ruby).
      - if: matrix.ruby == '3.4'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GraphQL documents match the API schema
        if: matrix.ruby == '3.4'
        run: |
          bundle exec bin/graphql-documents build/graphql
          # The checker imports graphql from where it lives, so the package goes at the repository root.
          (cd .. && npm install --silent --no-save --no-package-lock graphql@16)
          node ../scripts/graphql/check.mjs --schema ../graphql/schema.graphql --endpoint consumer build/graphql

  release:
    # Publishes the gem to rubygems.org when main carries a version that isn't there yet, then tags the commit
    # ruby-<version> (a prefix, so it never clashes with the Swift package's bare tags). RubyGems trusted publishing:
    # the gem's trusted publisher on rubygems.org names this repository, ruby.yml and the `rubygems` environment, so no
    # API key is stored here.
    needs: ruby
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby
      - name: Is this version on rubygems.org yet?
        id: version
        run: |
          version="$(ruby -r ./lib/audience-kit/version -e 'print Audience::Kit::VERSION')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/audience-kit/versions/$version.json")"
          if [[ "$status" == 200 ]]; then
            echo "audience-kit $version is on rubygems.org already."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Build and push the gem
        if: steps.version.outputs.published == 'false'
        run: |
          gem build audience-kit.gemspec
          gem push "audience-kit-${{ steps.version.outputs.version }}.gem"
      - name: Tag the release
        run: |
          tag="ruby-${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "The tag $tag is there already."
          else
            git tag "$tag" && git push origin "refs/tags/$tag"
          fi
