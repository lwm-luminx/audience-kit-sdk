name: Rust

# The audiencekit crate in rust/: rustfmt, clippy, tests with line coverage at 85% or more (the repository's floor),
# its GraphQL documents checked against the schema like the other SDKs', and a build on its minimum Rust. It has its
# own version (rust/Cargo.toml), so the Swift/Kotlin version job doesn't look at it. On main, the release job publishes a
# new version to crates.io and tags it rust-<version>.

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "graphql/**"
      - "scripts/graphql/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "graphql/**"
      - "scripts/graphql/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Tests, with line coverage at 85% or more (98% at 0.1.0)
        run: cargo llvm-cov --fail-under-lines 85
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GraphQL documents match the API schema
        run: |
          cargo run --quiet --example graphql_documents -- target/graphql
          # The checker imports graphql from where it lives, so the package goes at the repository root.
          (cd .. && npm install --silent --no-save --no-package-lock graphql@16)
          node ../scripts/graphql/check.mjs --schema ../graphql/schema.graphql --endpoint consumer target/graphql

  msrv:
    # rust-version in Cargo.toml: goose builds on newer Rust, but the crate shouldn't need it. Only the library: the
    # test-only dependencies (wiremock) need a newer Rust, and nothing that depends on the crate builds them.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --lib

  release:
    # Publishes the crate to crates.io when main carries a version that isn't there yet, then tags the commit
    # rust-<version>. crates.io trusted publishing (rust-lang/crates-io-auth-action): the crate's trusted publisher names
    # this repository, rust.yml and the `crates-io` environment. crates.io takes a trusted publisher only once a crate
    # exists, so the very first release uses a CARGO_REGISTRY_TOKEN secret in that environment, deleted afterwards.
    needs: [rust, msrv]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      FIRST_RELEASE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Is this version on crates.io yet?
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -A 'audience-kit-sdk release (github.com/lwm-luminx/audience-kit-sdk)' "https://crates.io/api/v1/crates/audiencekit/$version")"
          if [[ "$status" == 200 ]]; then
            echo "audiencekit $version is on crates.io already."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trusted publishing token
        id: auth
        if: steps.version.outputs.published == 'false' && env.FIRST_RELEASE_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the crate
        if: steps.version.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.FIRST_RELEASE_TOKEN }}
      - name: Tag the release
        run: |
          tag="rust-${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "The tag $tag is there already."
          else
            git tag "$tag" && git push origin "refs/tags/$tag"
          fi
