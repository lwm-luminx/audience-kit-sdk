name: Swift and Kotlin

# The Swift package and the Kotlin (KMP core + JVM + Android) libraries. They share one version (VERSION) and one
# release, so they stay in one workflow: the release job tags a version only once both have passed. Each SDK in the
# repository has its own workflow with its own path filter, so a pull request for one language neither runs nor
# conflicts with another's CI.

on:
  push:
    branches: [main]
    paths:
      - "Package.swift"
      - "swift/**"
      - "core/**"
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "graphql/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "scripts/check-version.sh"
      - "scripts/set-version.sh"
      - "scripts/swift-coverage.sh"
      - "scripts/tag-release.sh"
      - "scripts/graphql/**"
      - "xcode-cloud/**"
      - ".spi.yml"
      - ".github/workflows/swift-kotlin.yml"
  pull_request:
    paths:
      - "Package.swift"
      - "swift/**"
      - "core/**"
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "graphql/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "scripts/check-version.sh"
      - "scripts/set-version.sh"
      - "scripts/swift-coverage.sh"
      - "scripts/tag-release.sh"
      - "scripts/graphql/**"
      - "xcode-cloud/**"
      - ".spi.yml"
      - ".github/workflows/swift-kotlin.yml"
  workflow_dispatch:

permissions:
  # Read-only by default; jobs that tag releases ask for contents: write themselves.
  contents: read

concurrency:
  # A newer push to a pull request replaces its run; runs on main always finish (they tag releases).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test --enable-code-coverage
        env:
          # RenderedDocumentsTests writes the documents the SDK builds from a SchemaShape here, for the graphql job.
          AUDIENCEKIT_DOCUMENTS_DIR: ${{ github.workspace }}/rendered-documents
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-documents
          path: rendered-documents
      # Line coverage of what builds on Linux must stay at 85% or more (86.8% at 0.42.0).
      - run: scripts/swift-coverage.sh 85

  kotlin:
    # core/ and android/ are one Gradle build at the root. The runner image ships the Android SDK (ANDROID_HOME), so
    # audiencekit-android builds too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the JVM library and the Android library
        run: ./gradlew build
      - name: Line coverage of the core and the JVM library stays at 85% or more (90.7% at 0.42.0)
        run: ./gradlew koverVerify koverLog

  graphql:
    # The documents are string literals no codegen reads yet; check them against graphql/schema.graphql, the API's
    # consumer schema as of the API's next branch (the monorepo copies it in when it changes). The published schema on
    # developer.audiencekit.com is production's, which lags the fields the SDK already uses.
    needs: swift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-documents
          path: rendered-documents
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GraphQL documents match the API schema
        # scripts/graphql/check.mjs is a copy of developer.audiencekit.com's graphql/check.mjs (bundles/next), kept here
        # because that host doesn't resolve from the runners (as in staff-kit).
        run: |
          npm install --silent --no-save --no-package-lock graphql@16
          node scripts/graphql/check.mjs --schema graphql/schema.graphql --endpoint consumer swift/Sources android/audiencekit/src/main
      - name: The documents built from a SchemaShape match the API schema too
        # check.mjs can't read these from the source (they interpolate their fields), so it skips them above.
        run: node scripts/graphql/check.mjs --schema graphql/schema.graphql --endpoint consumer rendered-documents

  apple:
    # The update prompts' StoreKit, SwiftUI and UIKit code only builds on Apple platforms, which Linux skips.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: xcodebuild build -scheme AudienceKit-Package -destination 'generic/platform=iOS Simulator' -quiet

  version:
    # Swift and Kotlin share one version (VERSION), and each change to the SDK needs a new one: apps send it, and the
    # API refuses ones below its minimum.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-version.sh origin/${{ github.base_ref || 'main' }}

  release:
    # Publishes the Swift package: once everything above passes on main, tags each VERSION that has no tag yet (no "v",
    # at the merge that set it) and opens its GitHub release from CHANGELOG.md. Swift Package Manager and Xcode resolve
    # `from: "X.Y.Z"` from these tags. The workflow's own token pushes them, so no secret is needed; the Xcode Cloud
    # workflow runs the same script and finds the tag there already (xcode-cloud/README.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [swift, kotlin, graphql, apple, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/tag-release.sh --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
