"""
A group of venues: nearby (venues.nearby), where friends are (venues.friends),
on tonight (venues.tonight), all of them (venues.all), or the "help fill your
city" card (venues.thinCity, no venues).
"""
type VenuesCard implements ICard {
  """
  Stable for this card in this place, e.g. now.chat:<venue id>.
  """
  id: ID!

  """
  What it is: now.stage, now.chat, now.smallTalk, posts.tonight, posts.locale,
  events.upcoming, venues.nearby, venues.friends, venues.tonight, venues.all,
  venues.thinCity, people.playingThisWeek, people.basedHere, people.everyone,
  pings, web or promo.slot. New kinds are added; a kind the app did not list in
  cardKinds is never sent.
  """
  kind: String!

  """
  The locale they are in.
  """
  locale: Locale

  """
  Its place on the screen, from 1 at the top.
  """
  rank: Int!

  """
  A heading the app may use; null to use its own.
  """
  title: String

  """
  The venues, in the order to show them.
  """
  venues: [Venue!]!
}

