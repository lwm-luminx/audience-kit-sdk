  The licenses it applies to, e.g. bar, or all_on_premise.
  """
  licenseClasses: [String!]!

  """
  Whether a county or city can set different hours.
  """
  localOverridePossible: Boolean!

  """
  Caveats from the research.
  """
  notes: String

  """
  The statute, code section or page it comes from.
  """
  sourceTitle: String

  """
  Where that source was read.
  """
  sourceUrl: String

  """
  The rule in a sentence.
  """
  summary: String!

  """
  Local time as HH:MM; null for rules with no time.
  """
