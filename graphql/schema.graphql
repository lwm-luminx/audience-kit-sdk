  """
  A list of edges.
  """
  edges: [IModerationProviderEdge]

  """
  A list of nodes.
  """
  nodes: [IModerationProvider]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type IModerationProviderEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: IModerationProvider
}

