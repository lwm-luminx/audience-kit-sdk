"""
The subscription root of this schema
"""
type Subscription {
  """
  Follows a record's lists (a venue's events, an event's appearances): an event
  whenever a member joins, leaves or changes, carrying the member as you may
  read it. Name an `edge` to hear about one list only.
  """
  edgeChanged(
    """
    Only this list, by its association's name (`events`); every list without it.
    """
    edge: String

    """
    The record's ID, as node(id:) takes it.
    """
    id: ID!
  ): EdgeChanged! @requires(permissions: ["audience:read:self", "venues:read:venue"])

  """
  Follows a locale's chat room, for people out in the locale and not at a venue:
  ChatJoined, then everything the room says and who comes and goes, until
  ChatLeft. The room's admins join from anywhere.
  """
  localeChat(
    """
    The locale.
    """
    localeId: ID!

    """
    Follows the room without being in it: no presence, so nobody sees the
    subscriber as in chat. For a glimpse of the room, like ChatPeek.
    """
    watch: Boolean = false
  ): ChatRoomEvent! @requires(permissions: ["chat:read:self"])

  """
  Your notifications while the app is open, in concert with your devices' push
  service: each push sent to you (a friend's ping, a reply) arrives here too,
  with the `notificationId` the device copy carries, so the app shows it itself
  and skips the system banner. Nothing arrives on subscribing.
  """
  myNotifications: PushNotification! @requires(permissions: ["users:read:self"])

  """
  Follows a record by its ID: an event whenever it changes or is deleted,
  carrying the record as you may read it then, so you select what you show and
  need no refetch. Any Node you can see; nothing arrives until it changes.
  """
  nodeChanged(
    """
    The record's ID, as node(id:) takes it.
    """
    id: ID!
  ): NodeChanged! @requires(permissions: ["audience:read:self", "venues:read:venue"])

  """
  Follows a venue's chat room: ChatJoined, then everything the room says and who
  comes and goes, until ChatLeft. Open to people at the venue, and to the room's
  admins from anywhere.
  """
  venueChat(
    """
    The venue.
    """
    venueId: ID!

    """
    Follows the room without being in it: no presence, so nobody sees the
    subscriber as in chat. For a glimpse of the room, like ChatPeek.
    """
    watch: Boolean = false
  ): ChatRoomEvent! @requires(permissions: ["chat:read:self", "chat:read:venue"])
}

