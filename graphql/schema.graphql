"""
An entry in a lineup: someone (or several people) on, or an intermission. A
lineup is a venue night's own, built as the night goes, or an event's, built
ahead. Each runs in `position` order and can be advanced like a slide deck
(advanceLineup).
"""
type Appearance implements Node {
  """
  A segment or intermission: what runs in the venue's chat while it's on; null for nothing.
  """
  activity: AppearanceActivity

  """
  When advancing (or finishing it) took it off.
  """
  cameOffAt: ISO8601DateTime

  """
  An act the curtain rises on: places is called this many minutes before it (or
  once it is up next), and it goes on only on a go (goNoGo). Null: no curtain call.
  """
  curtainCallMinutes: Int

  """
  endTiming DURATION: how long it runs once on.
  """
  durationMinutes: Int

  """
  How it ends.
  """
  endTiming: AppearanceEndTiming!

  """
  Its set end time; null until close or advanced.
  """
  endsAt: ISO8601DateTime

  """
  What it is: an act, an intermission or a segment.
  """
  entryKind: AppearanceKind!

  """
  How long it is expected to run: its set length, else an act's scenes or tracks plus other time; null when nothing says.
  """
  estimatedMinutes: Int

  """
  The event whose lineup it's on, built ahead; null for one on the venue night's own lineup.
  """
  event: Event

  """
  An act: time beyond its scenes or tracks, as set; null for the default (10 minutes).
  """
  extraMinutes: Int

  """
  Whether it stretches or shrinks to bring the show back on time.
  """
  flexible: Boolean!

  """
  An act's curtain call go/no-go: who is ready. Null without a curtain call, and for anyone not working the show.
  """
  goNoGo: GoNoGo

  """
  Its UUID.
  """
  id: ID!

  """
  An act or an intermission. Segments read as INTERMISSION here, for apps built
  before them (they fail on values they do not know); entryKind has the full kind.
  """
  kind: AppearanceKind!

  """
  How many minutes after its set time it starts, as projected (negative: early); null without a set time.
  """
  lateMinutes: Int

  """
  The shortest it runs when it flexes, as set.
  """
  minMinutes: Int

  """
  How many of an act's scenes have no length or track (each counted as 4 minutes in the estimate).
  """
  missingTracks: Int!

  """
  The venue night it is on.
  """
  night: ISO8601Date!

  """
  Who's on it, in billing order: two for a duet.
  """
  people(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): PersonConnection!

  """
  Who, or the first of them; null for an intermission.
  """
  person: Person

  """
  Its place in its lineup's running order, from 0.
  """
  position: Int!

  """
  When it is expected off: when it came off, its hard end, else its projected start plus its estimate.
  """
  projectedEndsAt: ISO8601DateTime

  """
  When it is expected on: when it went on, its hard time, else moved out behind what runs late.
  """
  projectedStartsAt: ISO8601DateTime

  """
  What they are doing; null for an intermission.
  """
  role: AppearanceRole

  """
  An act's numbers, in order.
  """
  scenes: [Scene!]!

  """
  A singer's karaoke signup: the song, artist and who is singing it; null for everything else.
  """
  songRequest: SongRequest

  """
  How it starts.
  """
  startTiming: AppearanceStartTiming!

  """
  Its set (hard or soft) time, or when an entry with no set time went on; null until then.
  """
  startsAt: ISO8601DateTime

  """
  Upcoming, on now or done.
  """
  state: AppearanceState!

  """
  An act's billing (a duet's name) or an intermission's label, if it has one.
  """
  title: String

  """
  Who moves its trivia along; null unless it runs trivia.
  """
  triviaDriver: TriviaDriver

  """
  When its trivia answers show; null unless it runs trivia.
  """
  triviaReveal: TriviaReveal

  """
  The trivia set it runs: its own, else the best match for its event or venue tags. Null unless it runs trivia.
  """
  triviaSet: TriviaSet

  """
  Where.
  """
  venue: Venue!

  """
  When advancing put it on.
  """
  wentOnAt: ISO8601DateTime
}

"""
What runs by itself in the venue's chat while a segment or intermission is on.
"""
enum AppearanceActivity {
  """
  The event's chat prompts carry on.
  """
  PROMPTS

  """
  Group trivia: the room talks each round over in the chat and votes together (Venue.trivia). No scores.
  """
  TRIVIA
}

"""
The connection type for Appearance.
"""
type AppearanceConnection {
  """
  A list of edges.
  """
  edges: [AppearanceEdge]

  """
  A list of nodes.
  """
  nodes: [Appearance]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type AppearanceEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Appearance
}

"""
How a lineup entry ends.
"""
enum AppearanceEndTiming {
  """
  When the venue advances to what is next.
  """
  ADVANCE

  """
  When the night ends.
  """
  CLOSE

  """
  durationMinutes after it goes on, or when the venue advances, whichever is first.
  """
  DURATION

  """
  At its end time.
  """
  TIME
}

"""
What a lineup entry is.
"""
enum AppearanceKind {
  """
  Someone (or several people) on: hosting, DJing, performing or MCing.
  """
  ACT

  """
  A break in the show.
  """
  INTERMISSION

  """
  A generic time block with a title, e.g. "Photos with cast" for 10 minutes
  after an act (endTiming DURATION). It and an intermission can run an activity.
  """
  SEGMENT
}

"""
What someone is doing at a venue.
"""
enum AppearanceRole {
  """
  DJing.
  """
  DJ

  """
  Hosting.
  """
  HOST

  """
  MCing.
  """
  MC

  """
  Performing, e.g. a drag or live act.
  """
  PERFORMER

  """
  Singing karaoke: a signup, with its song as songRequest.
  """
  SINGER
}

"""
How a lineup entry starts.
"""
enum AppearanceStartTiming {
  """
  At its time, by the clock (or earlier, if advanced to).
  """
  HARD

  """
  No set time: when the venue advances to it.
  """
  NONE

  """
  Around its time: when the venue advances to it.
  """
  SOFT
}

"""
Where a lineup entry is in its night.
"""
enum AppearanceState {
  """
  Finished, or its night is over.
  """
  DONE

  """
  On now.
  """
  ON

  """
  Hasn't gone on yet.
  """
  UPCOMING
}

"""
A count rounded down into a bucket (none, a few, 5+, 10+, 25+, 50+, 100+), never exact.
"""
type ApproximateCount {
  """
  The bucket's floor: 0, 1, 5, 10, 25, 50 or 100.
  """
  atLeast: Int!

  """
  How to show it, e.g. "A few" or "10+".
  """
  label: String!
}

