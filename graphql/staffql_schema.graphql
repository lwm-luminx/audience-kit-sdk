}

"""
One hard rule checked for a song as it was placed.
"""
type DiverseShuffleCheck {
  """
  min_distance, max_same_in_window or min_gap.
  """
  check: String!

  """
  Why it passed without comparing, or what matched.
  """
  note: String

  """
  Whether the song passed it.
  """
  passed: Boolean!

  """
  The rule: its dimension and method, or the attributes it compares, such as
  sound/embedding or voice(voice_gender,register_band).
  """
  rule: String!

  """
  The rule's threshold at the loosening level used.
  """
  threshold: Float

  """
  What was found: the closest distance, how many alike songs in the window, or how many songs back the last alike one was.
  """
  value: Float
}

"""
What Diverse Shuffle does with songs a sing-along screen can't follow: no shared
lyric timing, and Musixmatch has no synced lyrics for them (or hasn't been asked yet).
"""
enum DiverseShuffleLyrics {
  """
  No difference: every song is shuffled together.
  """
  ANY

  """
  They play only after every song with lyrics in time, shuffled among themselves.
  """
  PREFER

  """
  They are left out, unless fewer than two songs have lyrics in time, as on a Sing-along night.
  """
  REQUIRE
}

"""
How Diverse Shuffle picks each song (DiverseShuffle::Generator).
"""
enum DiverseShuffleMode {
  """
  Pick a set of songs spread out from each other (a determinantal point process), place it in random order, repeat.
  """
  DPP

  """
  Shuffle, then take the first song that passes every hard rule. With nothing
  measured, the same order as Velvet's own shuffle.
  """
  GREEDY

  """
  Of the first few songs that pass, the one furthest from the songs before it
  (maximal marginal relevance), with a little randomness.
  """
  MMR
}

"""
One song in a Diverse Shuffle order, with why it went there.
"""
type DiverseShuffleStep {
  """
  The hard rules checked for it.
  """
  checks: [DiverseShuffleCheck!]!

  """
  How many songs were looked at for this slot.
  """
