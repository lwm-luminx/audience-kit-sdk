"""
One show (doc/LINEUP_MODEL.md): a venue zone's night, open to close, with its
own acts and breaks and each event in the zone as one step; or an event's in a
zone, a child of that night. It has hosts; its acts are scenes of performers.
The show goes from preshow to the host to each scene (back to the host, by
setting) to postshow.
"""
type Lineup implements Node {
  """
  A zone's night: its events' lineups in this zone, as they start.
  """
  children: [Lineup!]!

  """
  When it closes: a zone night's close, an event's end.
  """
  closesAt: ISO8601DateTime

  """
  The step on now; null while the host has it.
  """
  current: LineupStep

  """
  When the show ended, if it has.
  """
  endedAt: ISO8601DateTime

  """
  Its entries in order: acts, breaks, and the host and clock-run entries made before lineups.
  """
  entries: [Appearance!]!

  """
  The event whose lineup it is; null for a zone's night.
  """
  event: Event

  """
  The go/no-go of the act whose curtain the next advance raises. Null otherwise, and for anyone not working the show.
  """
  goNoGo: GoNoGo

  """
  Its hosts, in billing order.
  """
  hosts: [Person!]!

  """
  Its UUID.
  """
  id: ID!

  """
  What its event's jockeys are billed as (KJ, DJ or VJ); null for a zone's night.
  """
  jockeyLabel: String

  """
  Its event's jockeys (KJ, DJ or VJ): who runs the music or screens. Empty for a zone's night.
  """
  jockeys: [Person!]!

  """
  What it's billed as: its title, the event's name or the zone's.
  """
  name: String!

  """
  The venue night it runs on.
  """
  night: ISO8601Date!

  """
  When it opens: a zone night's open, an event's start.
  """
  opensAt: ISO8601DateTime

  """
  An event's: the zone night it is a step of.
  """
  parent: Lineup

  """
  Where the show stands.
  """
  phase: LineupPhase!

  """
  An event's breaks after its last scene: on in postshow.
  """
  postshow: [LineupStep!]!

  """
  An event's breaks before its first scene: on in preshow.
  """
  preshow: [LineupStep!]!

  """
  What ending a scene goes to unless the scene or its act says; null: the host.
  """
  sceneEndsTo: ShowEndsTo

  """
  When the show started, if it has.
  """
  startedAt: ISO8601DateTime

  """
  What advancing steps through, in order: scenes, breaks between them, and in a zone's night its events.
  """
  steps: [LineupStep!]!

  """
  Its billing, as set.
  """
  title: String

  """
  What advancing from the host puts on next.
  """
  upNext: LineupStep

  """
  Where.
  """
  venue: Venue!

  """
  Its zone; null for the venue's default zone.
  """
  zone: StageZone

  """
  Its zone's name: Stage for an unnamed default zone.
  """
  zoneName: String!
}

"""
Where a lineup's show stands (doc/LINEUP_MODEL.md).
"""
enum LineupPhase {
  """
  An intermission or segment is on.
  """
  BREAK

  """
  Over: an event's has ended, a zone's night has closed.
  """
  ENDED

  """
  A zone's night: one of its events is on (see its lineup).
  """
  EVENT

  """
  The host has the stage: between scenes, and at the start and end.
  """
  HOST

  """
  An event's, after the show ends until the event does. Breaks after the last scene run now.
  """
  POSTSHOW

  """
  Before "Start the show" (an event's, from its start; a zone's night, before it
  opens). Breaks before the first scene run now.
  """
  PRESHOW

  """
  A scene is on.
  """
  SCENE

  """
  An event's: its event hasn't started; the zone's night is on.
  """
  SCHEDULED
}

"""
One step of a show, in order: a scene of an act, a break, or (in a zone night) an event.
"""
type LineupStep {
  """
  A scene: its act.
  """
  act: Appearance

  """
  When it came off, if it has.
  """
  cameOffAt: ISO8601DateTime

  """
  What ending it goes to: as set on it, its act or its lineup. Null for an event.
  """
  endsTo: ShowEndsTo

  """
  A break: the intermission or segment.
  """
  entry: Appearance

  """
  Its own ID, step:<kind>:<targetId>, so a normalizing cache never merges it into the record it steps through.
  """
  id: ID!

  """
  What it is.
  """
  kind: LineupStepKind!

  """
  An event: its lineup in this zone.
  """
  lineup: Lineup

  """
  Who performs it, in billing order.
  """
  performers: [Person!]!

  """
  A scene: the scene, null for an act with no scenes.
  """
  scene: Scene

  """
  Upcoming, on now or done.
  """
  state: AppearanceState!

  """
  The record it steps through: the scene's ID (the act's for an act with no scenes), the break's or the event lineup's.
  """
  targetId: ID!

  """
  What it's billed as.
  """
  title: String

  """
  When it went on, if it has.
  """
  wentOnAt: ISO8601DateTime
}

"""
What a step of a show is.
"""
enum LineupStepKind {
  """
  In a zone's night: an event's lineup, as one element.
  """
  EVENT

  """
  An intermission: a break between scenes.
  """
  INTERMISSION

  """
  A scene of an act: one or more performers.
  """
  SCENE

  """
  A segment, e.g. trivia or photos with the cast.
  """
  SEGMENT
}

"""
Something to get done for a lineup entry: from its venue's, event series',
event's or talent's task templates, or added to the entry alone. Any can be
removed from the entry. Shown only to the people working the show.
"""
type LineupTask {
  """
  What ticks it by itself; null when someone ticks it.
  """
  auto: LineupTaskAuto

  """
  Whether it is done.
  """
  done: Boolean!

  """
  When someone ticked it.
  """
  doneAt: ISO8601DateTime

  """
  Who ticked it: their full name.
  """
  doneByName: String

  """
  When it's due: its template's lead time before the entry's set time (else its event's start), or as set on the entry.
  """
  dueAt: ISO8601DateTime

  """
  Its UUID for the entry's own, else template:<template id>. Pass it with the entry to updateLineupTask.
  """
  id: ID!

  """
  More about it.
  """
  note: String

  """
  Whether it was taken off the entry (listed only with includeRemoved).
  """
  removed: Boolean!

  """
  Where it comes from.
  """
  source: LineupTaskSource!

  """
  The template it's from; null for the entry's own.
  """
  template: TaskTemplate

  """
  What to do.
  """
  title: String!
}

"""
What ticks a task by itself.
"""
enum LineupTaskAuto {
