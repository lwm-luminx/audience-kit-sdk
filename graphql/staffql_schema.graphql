"""
The local Music implementation of a venue's live music.
"""
type VenueMusicView implements IVenueMusic {
  """
  These songs in a random order where neighbouring songs do not sound or feel
  too alike (Diverse Shuffle), following a rule profile, with each step
  explained. The same seed gives the same order; with nothing measured about the
  songs, greedy mode gives Velvet's own shuffle for that seed.
  """
  diverseShuffle(
    """
    What to do with songs a sing-along screen can't follow: prefer or require lyrics in time.
    """
    lyrics: DiverseShuffleLyrics = ANY

    """
    How it picks each song.
    """
    mode: DiverseShuffleMode = GREEDY

    """
    A rule profile by name, such as show_tunes_default.
    """
    profile: String = "show_tunes_default"

    """
    A whole rule profile instead of a named one.
    """
    profileJson: JSON

    """
    The seed, such as "<event id>|2026-11-22".
    """
    seed: String!

    """
    The songs, at most 500: Spotify track URIs or ids, MBIDs (mbid:<id>) or ISRCs (isrc:<code>).
    """
    songs: [String!]!
  ): DiverseShuffle! @endpoint(in: [STAFF])

  """
  When each lyric line of these Spotify tracks or recordings is sung, without
  the words, for sing-along screens; tracks nobody has timed are left out.
  Shared by every venue.
  """
  lyricTimings(
    """
    Recordings by ISRC, at most 100 (any copy of the audio).
    """
    isrcs: [String!] = []

    """
    MusicBrainz recording ids (MBIDs), at most 100: a venue's own copy of a song
    finds its timing whether it was kept for a Spotify track or not.
    """
    musicbrainzRecordingIds: [String!] = []

    """
    Spotify track ids, at most 100.
    """
    spotifyTrackIds: [String!] = []
  ): [LyricTiming!]!

  """
  A song's words, fetched through AudienceKit's Musixmatch key so the venue's
  Mac needs no key of its own, and kept so each song is fetched once and
  survives the key failing. Only this venue's devices with the music permission.
  Null when the source has no words for it.
  """
  lyrics(
    """
    Artist name.
    """
    artist: String

    """
    Track length, so synced lyrics match this version.
    """
    durationMs: Int

    """
    The recording's ISRC.
    """
    isrc: String

    """
    The MusicBrainz recording id (MBID).
    """
    musicbrainzRecordingId: String

    """
    The Spotify track id.
    """
    spotifyTrackId: String

    """
    Track title.
    """
    title: String!
  ): SongLyrics

  """
  Latest track while equipment reporting is active.
  """
  nowPlaying: EquipmentTrack

  """
  Tonight's songs in the order the venue's Mac plays them (its night playlist in
  the lineup): the one on and the ones still to play. Null without a night
  playlist tonight.
  """
  queue: VenueMusicQueue

  """
  Tracks at the venue's Soundtrack matching a search, for its staff to queue one
  (queueVenueMusicServiceTrack). Whoever runs the show, as for
  controlVenueMusic.
  """
  serviceTracks(
    """
    A title, an artist, or both.
    """
    query: String!
  ): [MusicServiceTrack!]! @endpoint(in: [STAFF])
}

