"""
One ID a venue's door checked, as its log keeps it until it is deleted
(expiresAt). Only the fields its jurisdiction lets a door keep; for proving age only.
"""
type IdCheck {
  """
  Their age when checked.
  """
  age: Int

  """
  Their date of birth.
  """
  birthDate: ISO8601Date

  """
  When it was checked.
  """
  checkedAt: ISO8601DateTime!

  """
  The kind of ID.
  """
  documentKind: IdDocumentKind!

  """
  Scanned or typed in.
  """
  entry: IdCheckEntry!

  """
  When the log deletes it.
  """
  expiresAt: ISO8601DateTime!

  """
  The ID's expiry date.
  """
  expiresOn: ISO8601Date

  """
  male, female or unspecified, as on the ID.
  """
  gender: String

  """
  Its UUID.
  """
  id: ID!

  """
  The ID number, kept only for IDs typed in by hand (Utah keeps none for scans).
  """
  idNumber: String

  """
  The state or province that issued it, e.g. "UT".
  """
  issuer: String

  """
  The name on the ID.
  """
  name: String

  """
  The door saw NO ALCOHOL SALE on the card: they may come in but not buy or drink alcohol.
  """
  noAlcoholSale: Boolean!

  """
  What the check found.
  """
  outcome: IdCheckOutcome!
}

"""
How the door read an ID.
"""
enum IdCheckEntry {
  """
  Typed in by the door because it couldn't be scanned.
  """
  MANUAL

  """
  Read from the barcode on the card's back.
  """
  SCAN
}

"""
A venue door's ID check log as it stands: every check its jurisdiction still
lets it keep, newest first. This is what the door hands law enforcement when
asked; nothing is sent anywhere.
"""
type IdCheckLog {
  """
  The checks, newest first.
  """
  checks: [IdCheck!]!

  """
  The same checks as CSV, to share with law enforcement.
  """
  csv: String!
}

"""
What the door should do with a checked ID (doc/DOOR_ID_CHECKS.md).
"""
enum IdCheckOutcome {
  """
  Past its expiry date: not proof of age.
  """
  EXPIRED

  """
  Valid, not expired, and old enough to drink.
  """
  OK

  """
  The barcode isn't shaped like a real one, or the door marked it fake: keep the
  ID and call the police (Utah Code 32B-1-407).
  """
  SUSPECT

  """
  Younger than the drinking age (or no birth date).
  """
  UNDER_AGE
}

"""
What a venue's door must do with IDs where it is (DoorId::Policy,
doc/DOOR_ID_CHECKS.md). Nothing is reported to any state: the door keeps a short
log and shows it to law enforcement on request.
"""
type IdCheckPolicy {
  """
  The law it follows, e.g. "Utah Code 32B-1-407".
  """
  citation: String

  """
  The age a check must show.
  """
  drinkingAge: Int!

  """
  The state or province, e.g. "UT"; null when unknown.
  """
  jurisdiction: String

  """
  How long the log keeps a check before deleting it.
  """
  retentionHours: Int!

  """
  Whose ID to scan.
  """
  scan: IdCheckScanRule!

  """
  The rules in a sentence or two, for the door.
  """
  summary: String!

  """
  What to look for on the card that a scanner can't read, e.g. Utah's NO ALCOHOL SALE marking.
  """
  visualCheck: String
}

"""
Whose ID a venue's door must scan, by its jurisdiction (DoorId::Policy).
"""
enum IdCheckScanRule {
  """
  Anyone who looks 35 or younger, before serving them alcohol (Utah restaurants).
  """
  APPEARS_35_OR_UNDER

  """
  Every ID, before letting anyone in (Utah bars and taverns).
  """
  EVERYONE

  """
  Nothing makes the door scan; it may.
  """
  OPTIONAL
}

"""
The kind of ID checked at a door.
"""
enum IdDocumentKind {
  """
  A driver's licence.
  """
  DRIVERS_LICENSE

  """
  A state or provincial ID card.
  """
  ID_CARD

  """
  A military ID.
  """
  MILITARY

  """
  Any other acceptable ID, e.g. a foreign licence.
  """
  OTHER

  """
  A passport or passport card.
  """
  PASSPORT
}

