"""
How a lineup entry ends.
"""
enum AppearanceEndTiming {
  """
  When the venue advances to what is next.
  """
  ADVANCE

  """
  When the night ends.
  """
  CLOSE

  """
  durationMinutes after it goes on, or when the venue advances, whichever is first.
  """
  DURATION

  """
  At its end time.
  """
  TIME
}

"""
What a lineup entry is.
"""
enum AppearanceKind {
  """
  Someone (or several people) on: hosting, DJing, performing or MCing.
  """
  ACT

  """
  A break in the show.
  """
  INTERMISSION

  """
  A generic time block with a title, e.g. "Photos with cast" for 10 minutes
  after an act (endTiming DURATION). It and an intermission can run an activity.
  """
  SEGMENT
}

"""
What someone is doing at a venue.
"""
enum AppearanceRole {
  """
  DJing.
  """
  DJ

  """
  Hosting.
  """
  HOST

  """
  MCing.
  """
  MC

  """
  Performing, e.g. a drag or live act.
  """
  PERFORMER

  """
  Singing karaoke: a signup, with its song as songRequest.
  """
  SINGER
}

"""
How a lineup entry starts.
"""
enum AppearanceStartTiming {
  """
  At its time, by the clock (or earlier, if advanced to).
  """
  HARD

  """
  No set time: when the venue advances to it.
  """
  NONE

  """
  Around its time: when the venue advances to it.
  """
  SOFT
}

"""
Where a lineup entry is in its night.
"""
enum AppearanceState {
  """
  Finished, or its night is over.
  """
  DONE

  """
  On now.
  """
  ON

  """
  Hasn't gone on yet.
  """
  UPCOMING
}

"""
A count rounded down into a bucket (none, a few, 5+, 10+, 25+, 50+, 100+), never exact.
"""
type ApproximateCount {
  """
  The bucket's floor: 0, 1, 5, 10, 25, 50 or 100.
  """
  atLeast: Int!

  """
  How to show it, e.g. "A few" or "10+".
  """
  label: String!
}

"""
A Soapbox publication's article, in Markdown (doc/SOAPBOX.md): its own, or an
op-ed a reader sent it. Readers see it once it is published; the publication,
the writer and the audience's admins see it before.
"""
type Article implements HasCredits & HasTimestamps {
  """
  The ad to show after it in the reader, sold by its publication on its own
  content (label Ad, soldBy). Null on a teaser or an op-ed, when none runs, or
  when the reader reads it without ads. Report it with recordCardViews.
  """
  ad: PromoCard

  """
  Every credit on it, shown or not, for its admins.
  """
  allCredits: [Credit!]! @requires(permissions: ["audience:write:*"]) @endpoint(in: [STAFF])

  """
  Who started it, or the reader who sent an op-ed: the audience's admins only.
  """
  author: Profile @requires(permissions: ["soapbox:read:*"])

  """
  What it says, in Markdown.
  """
  body: String!

  """
  Who it shows as written by: its byline, else the publication's name.
  """
  byline: String!

  """
  Where the publication also publishes it.
  """
  canonicalUrl: String

  """
  When it was started.
  """
  createdAt: ISO8601DateTime!

  """
  Its credits that everyone sees, original source first.
  """
  credits: [Credit!]!

  """
  Ties the publication declared to what it covers (its own gala, a sponsor), shown to readers above the article.
  """
  disclosure: String

  """
  Whether it changed after it was published.
  """
  edited: Boolean!

  """
  Events it's about.
  """
  events: [Event!]!

  """
  Whether it's in the audience's national news now (soapbox.articles(national: true)).
  """
  featuredNationally: Boolean!

  """
  When an admin featured it nationally (featureArticleNationally); null when they did not. Admins only.
  """
  featuredNationallyAt: ISO8601DateTime @requires(permissions: ["soapbox:read:*"])

  """
  Its photo, described for screen readers.
  """
  heroAltText: String

  """
  Its photo, shown above it.
  """
  heroPhotoUrl: PhotoURL

  """
  Its UUID.
  """
  id: ID!

  """
  The publication's own, or a reader's op-ed.
  """
  kind: ArticleKind!

  """
  Locales it's about.
  """
  locales: [Locale!]!

  """
  People it's about.
  """
  people: [Person!]!

  """
  Whether it's pinned above the publication's others.
  """
  pinned: Boolean!

  """
  Who publishes it.
  """
  publication: Publication!

  """
  When it went (or, scheduled, goes) live.
  """
  publishedAt: ISO8601DateTime

  """
  When its locale push went out (ArticlePush).
  """
  pushedAt: ISO8601DateTime @requires(permissions: ["soapbox:read:mine", "soapbox:read:*"])

  """
  When the audience's admins took it down (removeArticle); null while it stands. Admins only.
  """
  removedAt: ISO8601DateTime @requires(permissions: ["soapbox:read:*"])

  """
  Why it was sent back, or why an op-ed was declined.
  """
  reviewNote: String @requires(permissions: ["soapbox:read:mine", "soapbox:read:*", "soapbox:read:self"])

  """
  When the audience's admins last approved, sent back or removed it. Admins only.
  """
  reviewedAt: ISO8601DateTime @requires(permissions: ["soapbox:read:*"])

  """
  The admin who last approved, sent back or removed it.
  """
  reviewedBy: Profile @requires(permissions: ["soapbox:read:*"])

  """
  Whether it is published but not live yet.
  """
  scheduled: Boolean!

  """
  Its name in links, unique in its publication.
  """
  slug: String!

  """
  Where it is between writing and readers: the publication, the writer and the audience's admins.
  """
  status: ArticleStatus @requires(permissions: ["soapbox:read:mine", "soapbox:read:*", "soapbox:read:self"])

  """
  When it was last sent in.
  """
  submittedAt: ISO8601DateTime @requires(permissions: ["soapbox:read:mine", "soapbox:read:*", "soapbox:read:self"])

  """
  A line or two under its title.
  """
  summary: String

  """
  A headline and blurb linking to the piece on the publication's site
  (canonicalUrl): open that rather than a reader. Every article of a publication
  that links out (Publication.linksOut) is one.
  """
  teaser: Boolean!

  """
  Its headline.
  """
  title: String!

  """
  When it last changed.
  """
  updatedAt: ISO8601DateTime!

  """
  Venues it's about.
  """
  venues: [Venue!]!

  """
  Whether the signed-in reader reads its publication without ads now, from a
  tip: show no ads or sponsored spots with it. A teaser's own site is the
  publisher's business.
  """
  viewerAdFree: Boolean!

  """
  Whether the signed-in user may edit it: its publication's managers and the audience's admins.
  """
  viewerCanManage: Boolean!

  """
  Who can read it once published.
  """
  visibility: ArticleVisibility!
}

"""
The connection type for Article.
"""
type ArticleConnection {
  """
  A list of edges.
  """
