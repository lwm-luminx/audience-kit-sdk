  """
  The lyrics source's id for the words, such as a Musixmatch track id.
  """
  lyricsRef: String

  """
  Where the words come from, such as musixmatch.
  """
  lyricsSource: String

  """
  Lines timed from the audio; the rest were spread between them.
  """
  matchedLines: Int!

  """
