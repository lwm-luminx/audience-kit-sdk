  sheet. Stripe Checkout comes back to the API, which records it and returns to
  the app at audiencekit-velvet://billing?status=subscribed (or canceled). A
  first subscription starts with a free trial.
  """
  startVenueSubscription(
    """
    Parameters for VenueSubscriptionCheckout
    """
    input: VenueSubscriptionCheckoutInput!
  ): VenueSubscriptionCheckoutPayload @requires(permissions: ["venues:read:mine"])

  """
  Changes one of the audience's people. Listing managers change only their own
  name, website, photo and social links, and those of troupes they are in, all
  but the troupe's tip links.
  """
  updatePerson(
    """
    Parameters for PersonUpdate
    """
    input: PersonUpdateInput!
  ): PersonUpdatePayload @requires(permissions: ["people:write:mine", "people:write:my_troupes"])

  """
  Changes one of the audience's venues. Listing managers change only the name,
  description, website, social links and cover of their own.
  """
  updateVenue(
    """
    Parameters for VenueUpdate
    """
    input: VenueUpdateInput!
  ): VenueUpdatePayload @requires(permissions: ["venues:write:mine", "venues:write:venue", "locales:admin:mine"])

  """
  Withdraws your application to be a safety responder, while nobody has decided it.
  """
  withdrawSafetyResponderApplication(
    """
    Parameters for SafetyResponderApplicationWithdraw
    """
    input: SafetyResponderApplicationWithdrawInput!
  ): SafetyResponderApplicationWithdrawPayload @requires(permissions: ["safety:write:self"])
}

