  """
  Whether anything is known about the song (a measured recording); unknown songs pass every rule.
  """
  hasFeatures: Boolean!

  """
  The song as it was given (a Spotify track URI or id, an MBID).
  """
  key: String!

  """
  How far the rules were loosened to place it: 0 as written; past the profile's last step, only the soft score counted.
  """
  level: Int!

  """
  Its place, from 1.
  """
  position: Int!

  """
  How many songs were ruled out for this slot at that level.
  """
  rejected: Int!

  """
  How far it sits from the songs before it, 0 (alike) to 1.
  """
  score: Float!

  """
  Its title, when the recording is known.
  """
  title: String
}

