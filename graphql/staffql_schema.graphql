  The night whose lineup and checklist it shows: its event; in a series' shared
  room the night under way or next. Null in a venue's or locale's room.
  """
  lineupEvent: Event

  """
  The locale it's on, for a locale's room.
  """
  locale: Locale

  """
  Everyone in it, the strongest role first, then by name.
  """
  members: [RoomMember!]!

  """
  What was said there, newest first, without replies (a post's are on it).
  """
  messages(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Only lines, or only posts.
    """
    kind: RoomMessageKind

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): RoomMessageConnection!

  """
  The name of the venue, event or locale.
  """
  name: String

  """
  The persona it's on, for its committee's room.
  """
  person: Person

  """
  Its pinned posts, newest pinned first.
  """
  pinned: [RoomMessage!]!

  """
  The series it's on, for a room every night of a series shares (EventSeries.roomMode SHARED).
  """
  series: EventSeries

  """
  The venue it is on, or the event's venue; null for a locale's room.
  """
  venue: Venue

  """
  Whether the signed-in user may post as a venue: the venue's managers and the
  audience's admins; in a locale's room the managers of a venue there
